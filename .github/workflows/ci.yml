name: Tests, security checks and Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Syntax check
        run: python -m compileall -q agents mofa_integrator cli.py enrichment.py simulator.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify command-line entry point
        run: multi-omics-factor-analysis-mofa --help

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Run browser logic tests
        run: node --test tests/web.test.cjs

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python-tests, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
