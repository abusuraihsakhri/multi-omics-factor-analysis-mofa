version: '3.8'

services:
  multi-omics-factor-analysis-mofa:
    build: .
    container_name: multi-omics-factor-analysis-mofa
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=multi-omics-factor-analysis-mofa-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
